services:
  redis:
    image: "redis:latest"
    container_name: "redis_memory"
    hostname: ${REDIS_HOST}
    ports:
      - "${REDIS_PORT}:6379"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: "mango_sqlserver"
    hostname: ${DB_HOST}
    ports:
      - "${DB_PORT}:1433"
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init-db:/docker-entrypoint-initdb.d
    entrypoint: ["/docker-entrypoint-initdb.d/init-sqlserver.sh"]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: "rabbitmq_queue"
    hostname: ${RABBIT_HOST}
    ports:
      - "${RABBIT_PORT}:5672" # AMQP protocol port
      - "${RABBIT_MANAGEMENT_PORT}:15672" # RabbitMQ Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - rabbitmq_log:/var/log/rabbitmq/
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: "mango_adminer"
    hostname: ${ADMINER_HOST}
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: sqlserver
      ADMINER_DESIGN: "pepa-linha-dark"
    depends_on:
      - sqlserver
    restart: unless-stopped

volumes:
  sqlserver_data:
  rabbitmq_data:
  rabbitmq_log:
